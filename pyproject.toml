[project]
name = "gutemberg2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "weasyprint>=68.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.5",
    "ty>=0.0.21",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "ARG",  # flake8-unused-arguments
    "ERA",  # eradicate commented-out code
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long
    "COM812", # conflicts with formatter sometimes
    "ISC001", # can conflict with formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "T20",   # allow print in tests
    "ARG",   # unused args are common in tests/fixtures
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true